
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color:#f5f6f8;">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">게시글 수정</h3>
                </div>

                <div class="card-body">

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         th:text="${errorMessage}">
                    </div>

                    <form action="/board/update"
                          method="post"
                          name="updateForm">

                        <input type="hidden"
                               name="id"
                               th:value="${board.id}">

                        <input type="hidden"
                               name="boardHits"
                               th:value="${board.boardHits}">

                        <div class="mb-3">

                            <label class="form-label">
                                작성자
                            </label>

                            <input type="text"
                                   name="boardWriter"
                                   th:value="${board.boardWriter}"
                                   class="form-control"
                                   readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                제목
                            </label>

                            <input type="text"
                                   name="boardTitle"
                                   th:value="${board.boardTitle}"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                내용
                            </label>

                            <textarea name="boardContents"
                                      rows="10"
                                      class="form-control"
                                      th:text="${board.boardContents}">
                            </textarea>

                        </div>

                        <div class="text-end">

                            <button type="button"
                                    class="btn btn-secondary"
                                    onclick="history.back()">
                                취소
                            </button>

                            <button type="submit"
                                    class="btn btn-warning">
                                수정완료
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script th:if="${errorMessage}">
    alert('[[${errorMessage}]]');
</script>

</body>
</html>
