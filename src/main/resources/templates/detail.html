
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color:#f5f6f8;">

<div class="container mt-5">

    <!-- 게시글 -->
    <div class="card shadow-sm mb-4">

        <div class="card-header bg-dark text-white">
            <h3 th:text="${board.boardTitle}"></h3>
        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-4">
                    <strong>작성자</strong><br>
                    <span th:text="${board.boardWriter}"></span>
                </div>

                <div class="col-md-4">
                    <strong>작성일</strong><br>
                    <span th:text="${board.boardCreatedAt}"></span>
                </div>

                <div class="col-md-4">
                    <strong>조회수</strong><br>
                    <span th:text="${board.boardHits}"></span>
                </div>

            </div>

            <hr>

            <div style="min-height:200px;"
                 th:text="${board.boardContents}">
            </div>

        </div>

    </div>

    <!-- 버튼 -->
    <div class="mb-4">

        <button onclick="listReq()"
                class="btn btn-secondary">
            목록
        </button>

        <th:block th:if="${session.loginEmail == board.boardWriter}">

            <button onclick="updateReq()"
                    class="btn btn-warning">
                수정
            </button>

            <button onclick="deleteReq()"
                    class="btn btn-danger">
                삭제
            </button>

        </th:block>

    </div>

    <!-- 댓글 작성 -->
    <th:block th:if="${session.loginEmail != null}">

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                댓글 작성
            </div>

            <div class="card-body">

                <form action="/comment/save"
                      method="post">

                    <input type="hidden"
                           name="boardId"
                           th:value="${board.id}">

                    <p>
                        작성자 :
                        <strong th:text="${session.loginEmail}"></strong>
                    </p>

                    <textarea name="commentContents"
                              class="form-control"
                              rows="4"
                              placeholder="댓글을 입력하세요">
                    </textarea>

                    <div class="text-end mt-3">

                        <input type="submit"
                               value="댓글작성"
                               class="btn btn-primary">

                    </div>

                </form>

            </div>

        </div>

    </th:block>

    <!-- 댓글 목록 -->
    <div class="card shadow-sm">

        <div class="card-header">
            💬 댓글 목록
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(commentList)}">

                <p class="text-muted">
                    아직 댓글이 없습니다.
                </p>

            </div>

            <div th:each="comment : ${commentList}"
                 class="border rounded p-3 mb-3 bg-light">

                <div class="d-flex justify-content-between">

                    <strong th:text="${comment.commentWriter}">
                    </strong>

                    <span th:if="${session.loginEmail == comment.commentWriter}">

                        <a th:href="@{/comment/update/{id}(id=${comment.id})}"
                           class="btn btn-sm btn-outline-warning">
                            수정
                        </a>

                        <a th:href="@{/comment/delete/{id}(id=${comment.id})}"
                           class="btn btn-sm btn-outline-danger">
                            삭제
                        </a>

                    </span>

                </div>

                <hr>

                <div th:text="${comment.commentContents}">
                </div>

            </div>

        </div>

    </div>

</div>

<script th:inline="javascript">

    const listReq = () => {
        location.href = "/board/";
    }

    const updateReq = () => {
        const id = [[${board.id}]];
        location.href = `/board/update/${id}`;
    }

    const deleteReq = () => {
        const id = [[${board.id}]];
        location.href = `/board/delete/${id}`;
    }

</script>

</body>
</html>
```
