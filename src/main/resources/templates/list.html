
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Board List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color:#f5f6f8;">

<div class="container mt-5">

    <!-- 상단 -->
    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex justify-content-between align-items-center">

            <h2 class="mb-0">📋 Spring Board</h2>

            <div>

                <th:block th:if="${session.loginEmail == null}">
                    <a href="/member/login"
                       class="btn btn-outline-primary">
                        로그인
                    </a>

                    <a href="/member/save"
                       class="btn btn-primary">
                        회원가입
                    </a>
                </th:block>

                <th:block th:if="${session.loginEmail != null}">
                    <span class="me-3 fw-bold"
                          th:text="${session.loginEmail} + '님 환영합니다.'">
                    </span>

                    <a href="/member/logout"
                       class="btn btn-danger">
                        로그아웃
                    </a>
                </th:block>

            </div>

        </div>
    </div>

    <!-- 검색 -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form action="/board/search"
                  method="get"
                  class="row g-2">

                <div class="col-md-2">
                    <select name="searchType"
                            class="form-select">

                        <option value="title">제목</option>
                        <option value="writer">작성자</option>
                        <option value="contents">내용</option>
                        <option value="titleContents">
                            제목+내용
                        </option>

                    </select>
                </div>

                <div class="col-md-8">
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="검색어 입력">
                </div>

                <div class="col-md-2">
                    <button type="submit"
                            class="btn btn-primary w-100">
                        검색
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- 게시글 목록 -->
    <div class="card shadow-sm">

        <div class="card-body p-0">

            <table class="table table-hover mb-0">

                <thead class="table-dark">

                <tr class="text-center">
                    <th style="width:10%">번호</th>
                    <th style="width:40%">제목</th>
                    <th style="width:15%">작성자</th>
                    <th style="width:20%">작성일</th>
                    <th style="width:15%">조회수</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="board : ${boardList.content}">

                    <td class="text-center"
                        th:text="${board.id}">
                    </td>

                    <td>
                        <a th:href="@{|/board/${board.id}|}"
                           th:text="${board.boardTitle}"
                           style="text-decoration:none;
                                  font-weight:bold;
                                  color:black;">
                        </a>
                    </td>

                    <td class="text-center"
                        th:text="${board.boardWriter}">
                    </td>

                    <td class="text-center"
                        th:text="${board.boardCreatedAt}">
                    </td>

                    <td class="text-center"
                        th:text="${board.boardHits}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- 일반 페이징 -->
    <div th:if="${keyword == null}"
         class="mt-4">

        <nav>
            <ul class="pagination justify-content-center">

                <li class="page-item"
                    th:if="${boardList.hasPrevious()}">

                    <a class="page-link"
                       th:href="@{/board/(page=${boardList.number})}">
                        이전
                    </a>

                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(1, boardList.totalPages)}">

                    <a class="page-link"
                       th:href="@{/board/(page=${i})}"
                       th:text="${i}">
                    </a>

                </li>

                <li class="page-item"
                    th:if="${boardList.hasNext()}">

                    <a class="page-link"
                       th:href="@{/board/(page=${boardList.number+2})}">
                        다음
                    </a>

                </li>

            </ul>
        </nav>

    </div>

    <!-- 검색 페이징 -->
    <div th:if="${keyword != null}"
         class="mt-4">

        <nav>
            <ul class="pagination justify-content-center">

                <li class="page-item"
                    th:if="${boardList.hasPrevious()}">

                    <a class="page-link"
                       th:href="@{/board/search(
                            page=${boardList.number},
                            searchType=${searchType},
                            keyword=${keyword})}">
                        이전
                    </a>

                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(1, boardList.totalPages)}">

                    <a class="page-link"
                       th:href="@{/board/search(
                            page=${i},
                            searchType=${searchType},
                            keyword=${keyword})}"
                       th:text="${i}">
                    </a>

                </li>

                <li class="page-item"
                    th:if="${boardList.hasNext()}">

                    <a class="page-link"
                       th:href="@{/board/search(
                            page=${boardList.number+2},
                            searchType=${searchType},
                            keyword=${keyword})}">
                        다음
                    </a>

                </li>

            </ul>
        </nav>

    </div>

    <!-- 글쓰기 -->
    <div class="text-end mt-3">

        <th:block th:if="${session.loginEmail != null}">
            <button onclick="saveReq()"
                    class="btn btn-success">
                글쓰기
            </button>
        </th:block>

    </div>

</div>

<script>
    const saveReq = () => {
        location.href = "/board/save";
    }

    const loginReq = () => {
        location.href = "/member/login";
    }
</script>

</body>
</html>
```
