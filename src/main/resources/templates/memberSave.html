
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color:#f5f6f8;">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">회원가입</h3>
                </div>

                <div class="card-body">

                    <form action="/member/save" method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                이메일
                            </label>

                            <input type="text"
                                   name="memberEmail"
                                   class="form-control"
                                   placeholder="이메일 입력">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                비밀번호
                            </label>

                            <input type="password"
                                   name="memberPassword"
                                   class="form-control"
                                   placeholder="비밀번호 입력">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                이름
                            </label>

                            <input type="text"
                                   name="memberName"
                                   class="form-control"
                                   placeholder="이름 입력">

                        </div>

                        <div class="d-grid">

                            <button type="submit" class="btn btn-primary">
                                회원가입
                            </button>

                        </div>

                    </form>

                    <hr>

                    <div class="text-center">

                        이미 계정이 있으신가요?

                        <a href="/member/login">
                            로그인
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
